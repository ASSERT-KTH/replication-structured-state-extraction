[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sse-agent"
version = "0.1.0"
description = "Replication of the SKILL.state bounded-state agent runtime (arxiv 2608.26263v2) on top of agentknit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "agentknit",
]

[tool.hatch.build.targets.wheel]
packages = ["sse_agent"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
